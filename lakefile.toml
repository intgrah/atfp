name = "atfp"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Atfp"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Atfp"

[[lean_lib]]
name = "Atfp.Supervision1"

[[lean_lib]]
name = "Atfp.Supervision2"
